description: |
  Use three GPIOs to read the original SNES shift-register-based gamepad.

  The original button names and ordering are maintained.

compatible: "dmv,snes-gamepad"

include: base.yaml

properties:
  polling-interval-ms:
    type: int
    default: 20
    description: |
       Polling interval time in milliseconds

  latch-gpios:
    type: phandle-array
    required: true
    description: Latch pin (output). The flags are overridden in the driver
      but must be set to 0 in the DT.

  data-gpios:
    type: phandle-array
    required: true
    description: Data pin (input). The flags are overridden in the driver
      but must be set to 0 in the DT.

  clock-gpios:
    type: phandle-array
    required: true
    description: Clock pin (output). The flags are overridden in the driver
      but must be set to 0 in the DT.
